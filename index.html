<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Coach Management — Gestión de pagos y atletas para entrenadores deportivos">

  <!-- PWA Meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coach Mgmt">
  <meta name="theme-color" content="#F97316">
  <meta name="msapplication-TileColor" content="#0D1117">

  <!-- Iconos Apple -->
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">

  <!-- Estilos -->
  <link rel="stylesheet" href="styles.css">

  <!-- jsPDF para reportes (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

  <title>Coach Management</title>
</head>
<body>

  <!-- ══════════════════════════════════════════════════
       APP SHELL
       ══════════════════════════════════════════════ -->
  <div id="app">

    <!-- ── Header ───────────────────────────────────── -->
    <header id="app-header">
      <div class="header-left">
        <img src="assets/icons/logo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
        <div class="header-titles">
          <span class="header-app-name">Coach Management</span>
          <span id="header-team-name">Mi Equipo</span>
        </div>
      </div>
      <div class="header-right">
        <!-- Botón Acerca de — ícono "i" en círculo -->
        <button class="icon-btn icon-btn-about" id="btn-about" title="Acerca de" aria-label="Acerca de la aplicación">
          <img src="assets/icons/about-icon.svg" alt="Acerca de" class="header-icon-svg">
        </button>
        <button class="icon-btn" id="btn-settings" data-view="settings" title="Ajustes" aria-label="Ajustes">
          ⚙️
        </button>
      </div>
    </header>

    <!-- ── Contenido principal ──────────────────────── -->
    <main id="app-content" role="main" aria-live="polite">
      <!-- Las vistas se inyectan aquí dinámicamente -->
      <div class="loading-spinner">
        <div class="spinner"></div>
      </div>
    </main>

    <!-- ── Navegación inferior ──────────────────────── -->
    <nav id="bottom-nav" role="navigation" aria-label="Navegación principal">
      <button class="nav-item active" data-view="home" aria-label="Inicio">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Inicio</span>
      </button>
      <button class="nav-item" data-view="payments" aria-label="Pagos">
        <span class="nav-icon">💳</span>
        <span class="nav-label">Pagos</span>
      </button>
      <button class="nav-item" data-view="athletes" aria-label="Atletas">
        <span class="nav-icon">👥</span>
        <span class="nav-label">Atletas</span>
      </button>
      <button class="nav-item" data-view="reports" aria-label="Reportes">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Reportes</span>
      </button>
    </nav>

  </div><!-- /#app -->

  <!-- ══════════════════════════════════════════════════
       MODAL GLOBAL (sheet bottom)
       ══════════════════════════════════════════════ -->
  <div id="modal-overlay" role="dialog" aria-modal="true" aria-label="Diálogo">
    <div id="modal-content">
      <!-- Contenido inyectado dinámicamente -->
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════
       SCRIPTS — orden de carga importante
       ══════════════════════════════════════════════ -->

  <!-- Utilidades (sin dependencias) -->
  <script src="utils/theme.js"></script>
  <script src="utils/storage.js"></script>
  <script src="utils/date-system.js"></script>
  <script src="utils/logic.js"></script>
  <script src="utils/pdf-report.js"></script>
  <script src="utils/backup-system.js"></script>

  <!-- Componentes (dependen de utils) -->
  <script src="components/tutorial.js"></script>
  <script src="components/dashboard.js"></script>
  <script src="components/athletes.js"></script>
  <script src="components/payments.js"></script>
  <script src="components/calendar.js"></script>
  <script src="components/athlete-calendar.js"></script>

  <!-- Controlador principal (depende de todos los anteriores) -->
  <script src="app.js"></script>

  <!-- Botones del header conectados al router -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btn-settings')?.addEventListener('click', () => {
        window.CoachApp?.App?.navigateTo('settings');
      });
      document.getElementById('btn-about')?.addEventListener('click', () => {
        window.CoachApp?.App?.navigateTo('about');
      });
    });
  </script>

</body>
</html>
